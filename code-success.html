<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday !!!!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #2c1b33;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
        }

        .container {
            text-align: center;
            padding: 60px 40px;
            background: rgba(58, 27, 61, 0.95);
            max-width: 700px;
            border: 4px solid #ff8ac0;
            box-shadow: 0 0 30px rgba(255, 138, 192, 0.25);
        }

        h1 {
            font-size: 3em;
            margin-bottom: 30px;
            color: #ff8ac0;
            letter-spacing: 1px;
        }

        .character-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 30px 0 40px;
            height: 220px;
        }

        .character-img {
            width: 320px;
            height: 220px;
            object-fit: cover;
            border-radius: 18px;
            border: 4px solid #ff8ac0;
            background: #1e0f1e;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
        }

        .code-section {
            background: #6e4e7a;
            border: 3px solid #ff8ac0;
            padding: 30px 20px;
            margin: 30px 0;
        }

        .code-label {
            font-size: 1.2em;
            margin-bottom: 15px;
            color: #ffffff;
            font-weight: bold;
        }

        .gift-link {
            display: inline-block;
            color: #ff8ac0;
            font-size: 1.8em;
            font-weight: bold;
            text-decoration: underline;
            word-break: break-all;
        }

        .gift-link:hover {
            color: #ffd0ea;
        }

        .back-button {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 40px;
            background: #ff8ac0;
            color: #2c1b33;
            text-decoration: none;
            font-size: 1.1em;
            font-weight: bold;
            border: 3px solid #ff8ac0;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .back-button:hover {
            background: #ffd0ea;
            border-color: #ffd0ea;
        }
    </style>
</head>
<body>
    <div class="container"> 
        <h1>Happy Birthday !!!!</h1>

        <div class="character-wrap">
            <img class="character-img" src="assets/everybody.png" alt="Kat">
        </div>

        <div class="code-section">
            <div class="code-label">Your Gift:</div>
            <a class="gift-link" href="https://roblox.cashstar.com/gift-card/view/LEGQUGRji9LpLUfIOXog5F2B9/" target="_blank" rel="noopener noreferrer">
                https://roblox.cashstar.com/gift-card/view/LEGQUGRji9LpLUfIOXog5F2B9/
            </a>
        </div>

        <button class="back-button" onclick="window.location.href='index.html'">Back to Menu</button>
    </div>
</body>
</html>
